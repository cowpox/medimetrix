<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Minhas Avaliações</h2>
    </div>

    <!-- Filtros: status + médico simulado + busca por título -->
    <form class="row g-2 mb-3" method="get" th:action="@{/app/coleta}">

        <!-- Picker de situação da participação -->
        <div class="col-md-3">
            <div class="input-group input-group-sm">
                <span class="input-group-text">Situação</span>
                <select class="form-select" id="status" name="status">
                    <option value=""
                            th:selected="${status == null or #strings.isEmpty(status)}">
                        Todas
                    </option>
                    <option value="PENDENTE"
                            th:selected="${status == 'PENDENTE'}">
                        Não iniciada
                    </option>
                    <option value="EM_ANDAMENTO"
                            th:selected="${status == 'EM_ANDAMENTO'}">
                        Em andamento
                    </option>
                    <option value="RESPONDIDA"
                            th:selected="${status == 'RESPONDIDA'}">
                        Respondida
                    </option>
                </select>
            </div>
        </div>

        <!-- Picker de médico (simulação de login) -->
        <div class="col-md-4">
            <div class="input-group input-group-sm">
                <span class="input-group-text">Médico</span>
                <select class="form-select" id="medicoId" name="medicoId">
                    <option th:each="m : ${medicos}"
                            th:value="${m.id}"
                            th:text="${m.nome}"
                            th:selected="${m.id} == ${medicoId}">
                        Dr. Exemplo
                    </option>
                </select>
                <button class="btn btn-primary btn-sm" type="submit">OK</button>
            </div>
        </div>

        <!-- Campo de busca por título -->
        <div class="col-md-4 ms-auto">
            <div class="input-group input-group-sm" style="max-width: 320px; margin-left: auto;">
                <input class="form-control"
                       type="search"
                       name="termo"
                       placeholder="Buscar por título..."
                       th:value="${termo}">
                <button class="btn btn-outline-secondary btn-sm" type="submit">Buscar</button>
            </div>
        </div>
    </form>

    <!-- Tabela -->
    <table class="table table-hover align-middle">
        <thead>
        <tr>
            <th>Título</th>
            <th style="width: 180px;">Situação</th>
            <th style="width: 140px;">Prazo</th>
            <th class="text-end" style="width: 120px;">Ações</th>
        </tr>
        </thead>
        <tbody>

        <!-- Sem resultados -->
        <tr th:if="${#lists.isEmpty(avaliacoes)}">
            <td colspan="4" class="text-center text-muted">
                Nenhuma avaliação encontrada para o médico selecionado.
            </td>
        </tr>

        <!-- Linhas com dados -->
        <tr th:each="a : ${avaliacoes}">
            <td th:text="${a.titulo}">PA • Clínica Médica • 2025/01</td>
            <td>
        <span class="badge"
              th:text="${a.situacaoLabel}"
              th:classappend="' ' + ${a.situacaoBadgeClass}">
          Em andamento
        </span>
            </td>
            <td th:text="${a.prazo}">31/01/2025</td>
            <td class="text-end">
                <a class="btn btn-sm btn-primary"
                   th:href="@{/app/coleta/{id}/responder(id=${a.avaliacaoId}, medicoId=${medicoId})}"
                   th:text="${a.acaoLabel}">
                    Abrir
                </a>
            </td>

        </tr>
        </tbody>
    </table>

</div>
